name: Public lab checks
on:
  workflow_dispatch:
    inputs:
      lab:
        description: Lab number (0-7)
        required: true
        type: choice
        options: ['0', '1', '2', '3', '4', '5', '6', '7']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install course dependencies
        run: python -m pip install uv==0.12.18 && uv sync --locked
      - name: Check release and selected lab
        env:
          LAB_NUMBER: ${{ inputs.lab }}
        run: |
          uv run --locked python lab.py check
          uv run --locked python lab.py test "$LAB_NUMBER"
# This workflow provides feedback, not authoritative integrity attestation.
# Staff grading verifies the exact submitted commit using an external public key.
# Never put private signing keys or privileged tokens into a student workflow.
